# UCF-101 200-video discovery: retrieval-batch AdaSteer
#
# Purpose: test whether training one shared AdaSteer delta on an eval video plus
# retrieved neighbours regularizes quality in the cheaper standard-horizon
# setting. This is a quality/regularization test, not independent-TTA throughput.

method: delta_a
series: ucf101
series_name: ucf101_200_batch_retrieval_delta_a
description: "UCF-101 200-video discovery: retrieval-batch AdaSteer"

fixed:
  delta_lr: 2.5e-3
  delta_steps: 5
  batch_method: similarity
  retrieval_pool_dir: /scratch/wc3013/longcat-video-tta/datasets/ucf101_1000_480p
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 200
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: K1
    batch_videos: 1
  - run_id: K5
    batch_videos: 5
  - run_id: K10
    batch_videos: 10

