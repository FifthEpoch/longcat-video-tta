# Panda-70M: Long context frame generation at scale (Baseline + AdaSteer)
#
# 93 frames (14 cond + 79 gen), 1000 videos.
# Matches panda_longctx_delta_a.yaml but at full 1000-video scale.
# Video saving disabled to conserve disk.

method: delta_a
series: panda
series_name: panda_longctx_1000v
description: "Panda-70M long-context 1000v: 93-frame generation (baseline + AdaSteer)"

fixed:
  num_cond_frames: 14
  num_frames: 93
  gen_start_frame: 14
  tta_total_frames: 14
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 1000
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
    delta_steps: 0
    delta_lr: 0.005

  - run_id: ADA_S10
    delta_steps: 10
    delta_lr: 5.0e-3
