# Panda-70M: AdaSteer conditioning frames sweep (100 videos)
#
# Tests whether reducing num_cond_frames restores PSNR/SSIM gains.
# Original experiments (cond=2, gen_start=32) showed +0.3-0.5 dB PSNR gain.
# Current experiments (cond=14, gen_start=48) show flat PSNR.
# Hypothesis: with fewer conditioning frames, the model has less context
# and TTA can fill that gap, improving per-frame quality.
#
# cond=1 is the image-to-video prediction case.
# All runs generate 14 frames starting at gen_start_frame=48.
# Includes no-TTA baselines (delta_steps=0) for each cond count.
#
# Uses best AdaSteer config from prior sweep: 5 steps, lr=0.005.
method: delta_a
series: panda
series_name: panda_adasteer_cond_sweep
description: "Panda-70M: AdaSteer cond frames sweep (1/5/10, 100 videos)"

fixed:
  gen_start_frame: 48
  tta_total_frames: 48
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  # ── No-TTA baselines (delta_steps=0 → delta stays zero) ──
  - run_id: NOTTA_C1
    num_cond_frames: 1
    num_frames: 15
    tta_context_frames: 1
    delta_steps: 0
    delta_lr: 0.005

  - run_id: NOTTA_C5
    num_cond_frames: 5
    num_frames: 19
    tta_context_frames: 5
    delta_steps: 0
    delta_lr: 0.005

  - run_id: NOTTA_C10
    num_cond_frames: 10
    num_frames: 24
    tta_context_frames: 10
    delta_steps: 0
    delta_lr: 0.005

  # ── AdaSteer TTA (5 steps, lr=0.005 — best from prior sweep) ──
  - run_id: ADA_C1
    num_cond_frames: 1
    num_frames: 15
    tta_context_frames: 1
    delta_steps: 5
    delta_lr: 0.005

  - run_id: ADA_C5
    num_cond_frames: 5
    num_frames: 19
    tta_context_frames: 5
    delta_steps: 5
    delta_lr: 0.005

  - run_id: ADA_C10
    num_cond_frames: 10
    num_frames: 24
    tta_context_frames: 10
    delta_steps: 5
    delta_lr: 0.005
