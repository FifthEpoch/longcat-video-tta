# Panda-70M: Full-model TTA -- ES x CLIP ablation (1000 videos)
# Uses LR=5e-7 (best from UCF-101 Phase 2), 30 steps
# 2x2 ablation: {ES OFF, ES ON} x {CLIP OFF, CLIP ON}
method: full
series: panda
series_name: panda_full_ablation
description: "Panda-70M: Full TTA ES+CLIP ablation (LR=5e-7, 1000 videos)"

fixed:
  learning_rate: 5.0e-7
  num_steps: 30
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  optimizer: adamw
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 1000
  compute_fvd: true
  compute_fid: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: FULL_noES_noCLIP
    es_disable: true

  - run_id: FULL_ES_noCLIP
    es_check_every: 2
    es_patience: 3

  - run_id: FULL_noES_CLIP
    es_disable: true
    clip_gate_enabled: true
    clip_gate_threshold: 0.135

  - run_id: FULL_ES_CLIP
    es_check_every: 2
    es_patience: 3
    clip_gate_enabled: true
    clip_gate_threshold: 0.135
