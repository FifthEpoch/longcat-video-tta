# UCF-101: Autoregressive rollout sweep (baseline + AdaSteer)
#
# Goal: Demonstrate that AdaSteer's advantage compounds over longer horizons.
# gen_start_frame=14 allows 3 rollout steps on 62+ frame UCF videos:
#   step 1: frames 14-27, step 2: 28-41, step 3: 42-55
# Videos are saved for visual comparison.
method: delta_a
series: ucf
series_name: ucf_rollout_sweep
description: "UCF-101: rollout sweep (baseline + AdaSteer, 1/2/3 steps)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 14
  tta_total_frames: 14
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: false
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  # Baseline (no TTA) at each rollout depth
  - run_id: NOTTA_R1
    delta_steps: 0
    delta_lr: 0.005
    rollout_steps: 1

  - run_id: NOTTA_R2
    delta_steps: 0
    delta_lr: 0.005
    rollout_steps: 2

  - run_id: NOTTA_R3
    delta_steps: 0
    delta_lr: 0.005
    rollout_steps: 3

  # AdaSteer (10 steps, lr=5e-3) at each rollout depth
  - run_id: ADA_R1
    delta_steps: 10
    delta_lr: 5.0e-3
    rollout_steps: 1

  - run_id: ADA_R2
    delta_steps: 10
    delta_lr: 5.0e-3
    rollout_steps: 2

  - run_id: ADA_R3
    delta_steps: 10
    delta_lr: 5.0e-3
    rollout_steps: 3
