# Panda-70M 2048-video headline: LoRA R1 (tiny) + LoRA R8 (industry default)
#
# Sample size: 2048 (StyleGAN-V FVD protocol).
# Dataset    : datasets/panda_2048_480p.
#
# Two LoRA columns are included in the headline table so the paper can
# cleanly compare:
#
#   - LoRA R1 / 5 steps / lr=2e-4   : the per-rank winner from Series 3
#     and the recipe that did not catastrophically collapse on
#     single-clip TTA at 100v.
#   - LoRA R8 / 10 steps / lr=5e-5  : the industry-default "rank 8 +
#     long fine-tuning" recipe; matches what is cited in offline LoRA
#     fine-tuning literature.
#
# These two cover the spectrum from "tiny low-rank" to "the recipe people
# would assume out-of-the-box," so the AdaSteer-vs-LoRA framing in the
# paper is defensible against either reviewer suggestion.
#
# Submit chunked via:
#   bash sweep_experiment/sbatch/submit_standard_2048v_chunked.sh

method: lora
series: panda
series_name: panda_2048v_lora
description: "Panda-70M 2048v: LoRA R1 (S5, lr=2e-4) and LoRA R8 (S10, lr=5e-5)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 2048
  compute_fvd: true
  compute_fid: true
  compute_vbench: true
  min_fvd_videos: 256
  es_disable: true
  no_save_videos: false
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  target_modules: "qkv,proj"
  target_ffn: false
  lora_target_blocks: all

sweep:
  # Tiny-LoRA recipe: rank=1, 5 steps, higher LR.
  # Won the per-rank sweep in Series 3 (R1 PSNR=20.46 vs R8 PSNR=11.18).
  - run_id: LORA_R1
    lora_rank: 1
    lora_alpha: 2
    num_steps: 5
    learning_rate: 2.0e-4

  # Industry-default LoRA recipe.
  # April-winner on per-frame PSNR among rank>=4 configs; baseline FVD reference.
  - run_id: LORA_R8
    lora_rank: 8
    lora_alpha: 16
    num_steps: 10
    learning_rate: 5.0e-5
