# Panda-70M: No-TTA continuation baseline (1000 videos)
# Establishes the "LongCat with conditioning but no adaptation" baseline
# Matches UCF-101 Phase 2 frame geometry (gen_start_frame=48)
method: full
series: panda
series_name: panda_notta
description: "Panda-70M: No-TTA baseline (1000 videos, gsf=48)"

fixed:
  learning_rate: 0.0
  num_steps: 0
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer: sgd
  es_disable: true
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 1000
  compute_fvd: true
  compute_fid: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
