# Paper-aligned retrieval-augmented batch-level TTA (LoRA, long Panda)
#
# Long-context Panda setting: 93 frames = 14 conditioning + 79 generated.
# Trains one shared LoRA adapter on eval video + K-1 retrieved neighbours.
#
# Submit:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/panda_longctx_batch_retrieval_lora.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/panda_1000_480p \
#       --account torch_pr_36_mren \
#       --time 24:00:00

method: lora
series: panda
series_name: panda_longctx_batch_retrieval_lora
description: "Panda-70M long-context: retrieval batch-level LoRA TTA"

fixed:
  lora_rank: 8
  lora_alpha: 16
  lora_target_blocks: all
  learning_rate: 5.0e-5
  num_steps: 10
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  target_modules: "qkv,proj"
  target_ffn: false
  batch_method: similarity
  retrieval_pool_dir: /scratch/wc3013/longcat-video-tta/datasets/panda_1000_480p
  num_cond_frames: 14
  num_frames: 93
  gen_start_frame: 14
  tta_total_frames: 14
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 50
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: K1
    batch_videos: 1
  - run_id: K5
    batch_videos: 5
  - run_id: K10
    batch_videos: 10
