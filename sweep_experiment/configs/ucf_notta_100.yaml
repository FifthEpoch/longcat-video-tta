# UCF-101: No-TTA baseline (100 videos)
# Quick baseline to compare against AdaSteer diagnostic results.
method: full
series: ucf
series_name: ucf_notta_100
description: "UCF-101: No-TTA baseline (100 videos)"

fixed:
  learning_rate: 0.0
  num_steps: 0
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer: sgd
  es_disable: true
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 32
  tta_total_frames: 32
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
