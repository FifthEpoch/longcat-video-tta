# Panda-70M: AdaSteer TTA-overlap hypothesis test (100 videos)
#
# HYPOTHESIS: The Feb PSNR gains came from two properties of the old bug:
#   1. TTA training frames = generation conditioning frames (100% overlap)
#   2. Zero conditioning latents during training (delta encodes content)
#
# This config tests these factors independently:
#
# OLD_BUG:  tta_total=num_cond, tta_context=0 → replicates old behavior
# OVERLAP:  tta_total=num_cond, tta_context=num_cond → same frames, with cond
# NOCOND:   tta_total=48, tta_context=0 → all frames, but no conditioning
# BASELINE: tta_total=48, tta_context=14 → current behavior (for reference)
#
# All use the best AdaSteer hyperparams: 5 steps, lr=0.005, cond=14.
method: delta_a
series: panda
series_name: panda_adasteer_tta_overlap
description: "Panda-70M: AdaSteer TTA-overlap hypothesis test (100 videos)"

fixed:
  delta_steps: 5
  delta_lr: 0.005
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  # Replicate old bug: train on gen-cond frames only, with zero conditioning
  # tta_total=14 loads frames 34-47 (= generation conditioning frames)
  # tta_context=0 forces 0 conditioning latents in the loss
  - run_id: OLD_BUG
    tta_total_frames: 14
    tta_context_frames: 0

  # Factor 1 only: same frames as gen-cond, BUT with conditioning in training
  # tta_total=14 loads frames 34-47, tta_context=14 → cond present
  - run_id: OVERLAP_COND
    tta_total_frames: 14
    tta_context_frames: 14

  # Factor 2 only: all 48 frames, but zero conditioning in training
  # tta_total=48 loads frames 0-47, tta_context=0 → no cond
  - run_id: ALL_NOCOND
    tta_total_frames: 48
    tta_context_frames: 0

  # Current behavior (control): all 48 frames, normal conditioning
  - run_id: CURRENT
    tta_total_frames: 48
    tta_context_frames: 14
