# Paper-aligned retrieval-augmented batch-level TTA (AdaSteer)
#
# This is the modern replacement for exp5_batch_size_delta_a.yaml.
# It keeps the current standard-horizon Panda frame geometry and sweeps
# the number of retrieved neighbours used to train one shared AdaSteer delta.
#
# Submit:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/panda_batch_retrieval_delta_a.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/panda_1000_480p \
#       --account torch_pr_36_mren \
#       --time 24:00:00

method: delta_a
series: panda
series_name: panda_batch_retrieval_delta_a
description: "Panda-70M standard horizon: retrieval batch-level AdaSteer TTA"

fixed:
  delta_lr: 5.0e-3
  delta_steps: 10
  batch_method: similarity
  retrieval_pool_dir: /scratch/wc3013/longcat-video-tta/datasets/panda_1000_480p
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: K1
    batch_videos: 1
  - run_id: K5
    batch_videos: 5
  - run_id: K10
    batch_videos: 10
