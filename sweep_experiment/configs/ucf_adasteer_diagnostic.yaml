# UCF-101: AdaSteer-1 (single δ vector, 512 params) diagnostic
#
# Goal: Re-run AdaSteer-1 on UCF-101 with the same sweep points as the
# Panda diagnostic for a direct dataset-vs-dataset comparison.
#
# Previous best on UCF-101: 5 steps, lr=1e-2 (PSNR 22.54).
method: delta_a
series: ucf
series_name: ucf_adasteer_diagnostic
description: "UCF-101: AdaSteer-1 diagnostic (512 params, 100 videos)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 32
  tta_total_frames: 32
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: ADA_5s_lr1e2
    delta_steps: 5
    delta_lr: 1.0e-2

  - run_id: ADA_5s_lr5e3
    delta_steps: 5
    delta_lr: 5.0e-3

  - run_id: ADA_5s_lr1e3
    delta_steps: 5
    delta_lr: 1.0e-3

  - run_id: ADA_20s_lr1e2
    delta_steps: 20
    delta_lr: 1.0e-2
