# Paper-aligned retrieval-augmented batch-level TTA (AdaSteer, long UCF)
#
# Long-context UCF setting: 61 frames = 14 conditioning + 47 generated.
# Trains one shared AdaSteer delta on eval video + K-1 retrieved neighbours.
#
# Submit:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/ucf_longctx_batch_retrieval_delta_a.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/ucf101_100_480p \
#       --account torch_pr_36_mren \
#       --time 24:00:00

method: delta_a
series: ucf
series_name: ucf_longctx_batch_retrieval_delta_a
description: "UCF-101 long-context: retrieval batch-level AdaSteer TTA"

fixed:
  delta_lr: 5.0e-3
  delta_steps: 10
  batch_method: similarity
  retrieval_pool_dir: /scratch/wc3013/longcat-video-tta/datasets/ucf101_1000_480p
  num_cond_frames: 14
  num_frames: 61
  gen_start_frame: 14
  tta_total_frames: 14
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 50
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: K1
    batch_videos: 1
  - run_id: K5
    batch_videos: 5
  - run_id: K10
    batch_videos: 10
