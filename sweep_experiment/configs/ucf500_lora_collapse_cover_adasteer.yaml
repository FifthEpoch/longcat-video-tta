# AdaSteer regeneration on the LoRA-collapse cover-image subset.
#
# Uses the current best UCF AdaSteer configuration:
#   delta_steps=10, delta_lr=2.5e-3, anchor_reg_weight=0.2,
#   anchor_reg_sigmas="0.25,0.5,0.75", anchor_reg_noise_draws=2.
# Will be re-run with the combined-tricks winner once that sweep
# completes; the candidate IDs and subset dataset stay the same.

method: delta_a
series: ucf500_lora_collapse_cover
series_name: ucf500_lora_collapse_cover
description: "UCF-101 LoRA-collapse cover subset: AdaSteer regeneration (current best)"

fixed:
  delta_steps: 10
  delta_lr: 2.5e-3
  anchor_reg_weight: 0.2
  anchor_reg_sigmas: "0.25,0.5,0.75"
  anchor_reg_noise_draws: 2
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: false
  compute_fid: false
  es_disable: true
  no_save_videos: false
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: ADA_S10_AREG_D2
