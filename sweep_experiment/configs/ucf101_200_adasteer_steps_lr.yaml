# UCF-101 200-video discovery: AdaSteer step/LR sweep
#
# Purpose: cross-dataset short/standard-horizon confirmation before spending on
# long-horizon or 1000-video runs.
#
# Submit after creating datasets/ucf101_200_480p:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/ucf101_200_adasteer_steps_lr.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/ucf101_200_480p \
#       --account torch_pr_36_mren \
#       --time 08:00:00

method: delta_a
series: ucf101
series_name: ucf101_200_adasteer_steps_lr
description: "UCF-101 200-video discovery: AdaSteer step/LR standard horizon"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 200
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
    delta_steps: 0
    delta_lr: 0.005

  - run_id: S3_LR001
    delta_steps: 3
    delta_lr: 0.001

  - run_id: S3_LR0025
    delta_steps: 3
    delta_lr: 0.0025

  - run_id: S3_LR005
    delta_steps: 3
    delta_lr: 0.005

  - run_id: S5_LR001
    delta_steps: 5
    delta_lr: 0.001

  - run_id: S5_LR0025
    delta_steps: 5
    delta_lr: 0.0025

  - run_id: S5_LR005
    delta_steps: 5
    delta_lr: 0.005

  - run_id: S10_LR001
    delta_steps: 10
    delta_lr: 0.001

  - run_id: S10_LR0025
    delta_steps: 10
    delta_lr: 0.0025

  - run_id: S10_LR005
    delta_steps: 10
    delta_lr: 0.005
