# UCF-101 1000-video validation: balanced 200-video candidate S5_LR0025
#
# Purpose: full-scale validation of the standard-horizon AdaSteer config that
# balanced FVD and pointwise gains on the 200-video discovery subset.

method: delta_a
series: ucf101
series_name: ucf101_1000v_s5_lr0025_validation
description: "UCF-101 1000-video validation: AdaSteer S5 LR=0.0025"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 1000
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
    delta_steps: 0
    delta_lr: 0.0025

  - run_id: S5_LR0025
    delta_steps: 5
    delta_lr: 0.0025

