# Panda-70M: AdaSteer-1 (single δ vector, 512 params) diagnostic
#
# Goal: Test whether AdaSteer-1's minimal parameterization avoids the
# overfitting/degradation seen with LoRA on Panda-70M.
#
# Previous best on UCF-101: 5 steps, lr=1e-2 (PSNR 22.54).
# We test 3 LR values at 5 steps, plus 20 steps at the best UCF LR.
method: delta_a
series: panda
series_name: panda_adasteer_diagnostic
description: "Panda-70M: AdaSteer-1 diagnostic (512 params, 100 videos)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: ADA_5s_lr1e2
    delta_steps: 5
    delta_lr: 1.0e-2

  - run_id: ADA_5s_lr5e3
    delta_steps: 5
    delta_lr: 5.0e-3

  - run_id: ADA_5s_lr1e3
    delta_steps: 5
    delta_lr: 1.0e-3

  - run_id: ADA_20s_lr1e2
    delta_steps: 20
    delta_lr: 1.0e-2
