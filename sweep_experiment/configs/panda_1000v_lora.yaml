# Panda-70M: 1000-video LoRA evaluation
#
# Best LoRA config by PSNR from 100-video study:
#   rank=8, alpha=16, all blocks, 10 steps, LR=5e-5 (PSNR=18.616, FVD=644.6)
#
# No LoRA config beat baseline FVD (641.1) at 100 videos.
# This 1000-video run checks whether FVD separation appears at scale.
#
# Submit with:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/panda_1000v_lora.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/panda_1000_480p \
#       --account torch_pr_36_mren \
#       --time 48:00:00

method: lora
series: panda
series_name: panda_1000v_lora
description: "Panda-70M 1000-video: best LoRA config (R8, 10 steps)"

fixed:
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 1000
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  no_save_videos: true

sweep:
  # Best PSNR from 100-video study
  # rank=8, alpha=16, all blocks, 10 steps, LR=5e-5
  # 100v result: FVD=644.6, PSNR=18.616
  - run_id: LORA_R8_S10
    lora_rank: 8
    lora_alpha: 16
    lora_target_blocks: all
    num_steps: 10
    learning_rate: 5.0e-5
