# Panda-70M: LoRA LR sanity check (100 videos)
# Post-bugfix sanity: use LR=2e-4 (best from original UCF-101 Series 4 sweep)
# at 20 steps, no-ES, to verify TTA improvements after the audit fixes.
method: lora
series: panda
series_name: panda_lora_lr_sanity
description: "Panda-70M: LoRA LR sanity (R4, LR=2e-4, 20 steps, 100 videos)"

fixed:
  lora_rank: 4
  lora_alpha: 8
  lora_target_blocks: last_4
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: LR2e4_S20
    learning_rate: 2.0e-4
    num_steps: 20
