# Panda-70M: LoRA LR sanity check (100 videos)
# LR=2e-4 overfits at R4/last_4 (PSNR dropped 1.17 dB).
# Try LR=5e-5: midpoint between failed 2e-4 and near-neutral 1e-6.
method: lora
series: panda
series_name: panda_lora_lr_sanity
description: "Panda-70M: LoRA LR sanity (R4, LR=5e-5, 20 steps, 100 videos)"

fixed:
  lora_rank: 4
  lora_alpha: 8
  lora_target_blocks: last_4
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: LR5e5_S20
    learning_rate: 5.0e-5
    num_steps: 20
