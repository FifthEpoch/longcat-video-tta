# UCF-101 2048-video headline: LoRA R1 + LoRA R8
#
# Sample size: 2048.
# Dataset    : datasets/ucf101_2048_480p.
#
# Same dual-LoRA strategy as panda_2048v_lora.yaml (rank=1 tiny vs
# rank=8 industry-default) so the AdaSteer-vs-LoRA framing in the
# paper is consistent across datasets.

method: lora
series: ucf101
series_name: ucf101_2048v_lora
description: "UCF-101 2048v: LoRA R1 (S5, lr=2e-4) and LoRA R8 (S10, lr=5e-5)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 2048
  compute_fvd: true
  compute_fid: true
  compute_vbench: true
  min_fvd_videos: 256
  es_disable: true
  no_save_videos: false
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  warmup_steps: 3
  weight_decay: 0.01
  max_grad_norm: 10.0
  target_modules: "qkv,proj"
  target_ffn: false
  lora_target_blocks: all

sweep:
  - run_id: LORA_R1
    lora_rank: 1
    lora_alpha: 2
    num_steps: 5
    learning_rate: 2.0e-4

  - run_id: LORA_R8
    lora_rank: 8
    lora_alpha: 16
    num_steps: 10
    learning_rate: 5.0e-5
