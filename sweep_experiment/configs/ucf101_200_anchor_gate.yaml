# UCF-101 200-video discovery: anchor-loss gate for AdaSteer
#
# Uses the balanced 200-video candidate S5_LR0025 and reuses anchor-loss
# validation to decide whether/how strongly to apply the learned delta.

method: delta_a
series: ucf101
series_name: ucf101_200_anchor_gate
description: "UCF-101 200-video discovery: anchor-loss gate for AdaSteer"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 200
  compute_fvd: true
  compute_fid: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  delta_steps: 5
  delta_lr: 0.0025
  es_disable: false
  es_check_every: 5
  es_patience: 3
  es_anchor_sigmas: "0.25,0.5,0.75"
  es_noise_draws: 2
  es_holdout_fraction: 0.25

sweep:
  - run_id: G_OFF
    anchor_gate_mode: off

  - run_id: G_LOG
    anchor_gate_mode: log_only
    anchor_gate_threshold: 0.0

  - run_id: G_BIN_0
    anchor_gate_mode: binary
    anchor_gate_threshold: 0.0

  - run_id: G_BIN_001
    anchor_gate_mode: binary
    anchor_gate_threshold: 0.001

  - run_id: G_SOFT_001
    anchor_gate_mode: soft
    anchor_gate_threshold: 0.0
    anchor_gate_soft_scale: 0.01

