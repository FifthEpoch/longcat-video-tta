# UCF-101 200-video discovery: anchor-regularized AdaSteer objective
#
# Tests whether adding differentiable fixed-sigma heldout anchor loss to the
# TTA training objective improves robustness over the S5_LR0025 balanced winner.

method: delta_a
series: ucf101
series_name: ucf101_200_anchor_reg
description: "UCF-101 200-video discovery: anchor-regularized AdaSteer"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 200
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  delta_steps: 5
  delta_lr: 0.0025
  anchor_reg_sigmas: "0.25,0.5,0.75"
  anchor_reg_noise_draws: 1

sweep:
  - run_id: AREG0
    anchor_reg_weight: 0.0

  - run_id: AREG005
    anchor_reg_weight: 0.05

  - run_id: AREG01
    anchor_reg_weight: 0.1

  - run_id: AREG02
    anchor_reg_weight: 0.2

