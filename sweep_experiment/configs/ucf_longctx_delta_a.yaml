# UCF-101: Long context frame generation (Baseline + AdaSteer)
#
# Tests LongCat's long-context generation on UCF-101 (61 frames = 14 cond + 47 gen).
# num_frames=61 is the longest 4k+1 value that fits within UCF's 62-frame minimum.
# gen_start_frame=14 on 50 videos. Compares no-TTA baseline vs AdaSteer.
#
# Submit with:
#   python sweep_experiment/scripts/run_sweep.py \
#       --config sweep_experiment/configs/ucf_longctx_delta_a.yaml \
#       --data-dir /scratch/wc3013/longcat-video-tta/datasets/ucf101_100_480p \
#       --account torch_pr_36_mren \
#       --time 24:00:00

method: delta_a
series: ucf
series_name: ucf_longctx
description: "UCF-101 long-context: 61-frame generation (baseline + AdaSteer, 50 videos)"

fixed:
  num_cond_frames: 14
  num_frames: 61
  gen_start_frame: 14
  tta_total_frames: 14
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 4.0
  resolution: 480p
  seed: 42
  max_videos: 50
  compute_fvd: true
  compute_fid: true
  es_disable: true
  no_save_videos: false
  caption_guard_mode: warn
  feature_frame_guard_mode: warn

sweep:
  - run_id: NOTTA
    delta_steps: 0
    delta_lr: 0.005

  - run_id: ADA_S10
    delta_steps: 10
    delta_lr: 5.0e-3
