# Panda-70M: AdaSteer sweep at guidance=0.0 (100 videos)
#
# Finding: guidance=0.0 dramatically improves all metrics vs default (4.0):
#   No-TTA G0:  PSNR=20.38, SSIM=0.734, LPIPS=0.278, FVD=512.7
#   No-TTA G4:  PSNR=18.61, SSIM=0.682, LPIPS=0.320, FVD=641.1
#   AdaSteer G0 (10s, lr=0.005): PSNR=20.32, FVD=502.4
#
# This sweep: steps {5, 10, 15} × lr {0.001, 0.005, 0.01} at guidance=0.0
#
# IMPORTANT: Run with --data-dir datasets/panda_1000_480p --output-base sweep_experiment/results/sanity_100
method: delta_a
series: panda
series_name: panda_adasteer_g0
description: "Panda-70M: AdaSteer at guidance=0.0 — step×LR sweep (100 videos)"

fixed:
  num_cond_frames: 14
  num_frames: 28
  gen_start_frame: 48
  tta_total_frames: 48
  tta_context_frames: 14
  num_inference_steps: 50
  guidance_scale: 0.0
  resolution: 480p
  seed: 42
  max_videos: 100
  compute_fvd: true
  compute_fid: true
  es_disable: true
  caption_guard_mode: warn
  feature_frame_guard_mode: warn
  no_save_videos: false
  aug_enabled: true
  aug_flip: true

sweep:
  # ═══════════════════════════════════════════════════════════════════
  # 5 steps × LR
  # ═══════════════════════════════════════════════════════════════════

  - run_id: S5_LR001
    delta_steps: 5
    delta_lr: 0.001

  - run_id: S5_LR005
    delta_steps: 5
    delta_lr: 0.005

  - run_id: S5_LR01
    delta_steps: 5
    delta_lr: 0.01

  # ═══════════════════════════════════════════════════════════════════
  # 10 steps × LR
  # ═══════════════════════════════════════════════════════════════════

  - run_id: S10_LR001
    delta_steps: 10
    delta_lr: 0.001

  - run_id: S10_LR005
    delta_steps: 10
    delta_lr: 0.005

  - run_id: S10_LR01
    delta_steps: 10
    delta_lr: 0.01

  # ═══════════════════════════════════════════════════════════════════
  # 15 steps × LR
  # ═══════════════════════════════════════════════════════════════════

  - run_id: S15_LR001
    delta_steps: 15
    delta_lr: 0.001

  - run_id: S15_LR005
    delta_steps: 15
    delta_lr: 0.005

  - run_id: S15_LR01
    delta_steps: 15
    delta_lr: 0.01
